<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1a1f2e" />
<title>fffffish</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1f2e;
    overflow: hidden;
    height: 100%;
    width: 100%;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
  }
  body.touch-mode,
  body.touch-mode canvas {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- touch toggle ---------- */
  .touch-toggle {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top));
    left: calc(8px + env(safe-area-inset-left));
    z-index: 20;
    padding: 5px 12px;
    border-radius: 999px;
    border: 2px solid rgba(220, 195, 170, 0.9);
    background: rgba(255, 246, 238, 0.75);
    color: #463c50;
    font: 12px/1 ui-monospace, Menlo, monospace;
    cursor: pointer;
    opacity: 0.8;
    -webkit-tap-highlight-color: transparent;
  }
  .touch-toggle:hover { opacity: 1; }
  /* ---------- on-screen controls ---------- */
  .touch-controls {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }
  body.touch-mode .touch-controls { display: block; }

  .tbtn {
    pointer-events: auto;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid rgba(220, 195, 170, 0.95);
    background: rgba(255, 246, 238, 0.45);
    color: #463c50;
    font: 600 18px/1 ui-monospace, Menlo, monospace;
    box-shadow: 0 3px 0 rgba(40, 36, 60, 0.18);
    transition: transform 0.06s, background 0.06s;
  }
  .tbtn.pressed {
    transform: translateY(2px) scale(0.94);
    background: rgba(255, 238, 170, 0.85);
    box-shadow: 0 1px 0 rgba(40, 36, 60, 0.18);
  }
  .tbtn-cap {
    font-size: 9px;
    font-weight: 400;
    opacity: 0.75;
  }

  .dpad {
    position: absolute;
    left: calc(14px + env(safe-area-inset-left));
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(3, 54px);
    gap: 4px;
  }
  .dpad .tbtn { width: 54px; height: 54px; border-radius: 14px; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  .actions {
    position: absolute;
    right: calc(14px + env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: 46px 46px 46px;
    grid-template-rows: 34px 46px 84px;
    gap: 6px;
    justify-items: center;
    align-items: center;
  }
  .actions .small { width: 46px; height: 46px; font-size: 15px; }
  .actions .back { grid-column: 1 / span 3; grid-row: 1; width: 100%; height: 34px; border-radius: 999px; font-size: 12px; }
  .actions .q { grid-column: 1; grid-row: 2; }
  .actions .e { grid-column: 2; grid-row: 2; }
  .actions .k { grid-column: 3; grid-row: 2; }
  .actions .j { grid-column: 1; grid-row: 3; align-self: end; }
  .actions .act {
    grid-column: 2 / span 2;
    grid-row: 3;
    width: 84px;
    height: 84px;
    font-size: 20px;
    background: rgba(255, 208, 96, 0.55);
    border-color: rgba(199, 145, 45, 0.9);
  }

  /* ---------- name field (naming screen, touch mode) ---------- */
  .name-input {
    display: none;
    position: fixed;
    z-index: 15;
    box-sizing: border-box;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: #463c50;
    text-align: center;
    font-family: ui-monospace, Menlo, monospace;
    outline: none;
    caret-color: #e09696;
  }
  .name-input::placeholder { color: rgba(120, 110, 130, 0.6); }
</style>
</head>
<body>
<script type="module" src="./game.js"></script>
</body>
</html>
