<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1a1f2e" />
<title>fffffish</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1f2e;
    overflow: hidden;
    height: 100%;
    width: 100%;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
  }
  body.touch-mode,
  body.touch-mode canvas {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- touch toggle ---------- */
  .touch-toggle {
    position: fixed;
    bottom: calc(8px + env(safe-area-inset-bottom));
    left: calc(8px + env(safe-area-inset-left));
    z-index: 20;
    padding: 5px 12px;
    border-radius: 999px;
    border: 2px solid rgba(220, 195, 170, 0.9);
    background: rgba(255, 246, 238, 0.75);
    color: #463c50;
    font: 12px/1 ui-monospace, Menlo, monospace;
    cursor: pointer;
    opacity: 0.8;
    -webkit-tap-highlight-color: transparent;
  }
  .touch-toggle:hover { opacity: 1; }
  body.touch-mode .touch-toggle { bottom: calc(196px + env(safe-area-inset-bottom)); }
  /* ---------- on-screen controls ---------- */
  .touch-controls {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }
  body.touch-mode .touch-controls { display: block; }

  .tbtn {
    pointer-events: auto;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid rgba(220, 195, 170, 0.95);
    background: rgba(255, 246, 238, 0.45);
    color: #463c50;
    font: 600 18px/1 ui-monospace, Menlo, monospace;
    box-shadow: 0 3px 0 rgba(40, 36, 60, 0.18);
    transition: transform 0.06s, background 0.06s;
  }
  .tbtn.pressed {
    transform: translateY(2px) scale(0.94);
    background: rgba(255, 238, 170, 0.85);
    box-shadow: 0 1px 0 rgba(40, 36, 60, 0.18);
  }
  .tbtn-cap {
    font-size: 9px;
    font-weight: 400;
    opacity: 0.75;
  }

  .dpad {
    position: absolute;
    left: calc(14px + env(safe-area-inset-left));
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(3, 54px);
    gap: 4px;
  }
  .dpad .tbtn { width: 54px; height: 54px; border-radius: 14px; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  .actions {
    position: absolute;
    right: calc(14px + env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: 46px 46px 46px;
    grid-template-rows: 34px 46px 84px;
    gap: 6px;
    justify-items: center;
    align-items: center;
  }
  .actions .small { width: 46px; height: 46px; font-size: 15px; }
  .actions .back { grid-column: 1; grid-row: 1; width: 46px; height: 34px; border-radius: 999px; font-size: 10px; }
  .actions .l, .actions .t { grid-row: 1; width: 46px; height: 34px; border-radius: 999px; font-size: 12px; flex-direction: row; gap: 2px; }
  .actions .l { grid-column: 2; }
  .actions .t { grid-column: 3; }
  .actions .q { grid-column: 1; grid-row: 2; }
  .actions .e { grid-column: 2; grid-row: 2; }
  .actions .k { grid-column: 3; grid-row: 2; }
  .actions .j { grid-column: 1; grid-row: 3; align-self: end; }
  .actions .act {
    grid-column: 2 / span 2;
    grid-row: 3;
    width: 84px;
    height: 84px;
    font-size: 20px;
    background: rgba(255, 208, 96, 0.55);
    border-color: rgba(199, 145, 45, 0.9);
  }

  /* ---------- name field (naming screen, touch mode) ---------- */
  .name-input {
    display: none;
    position: fixed;
    z-index: 15;
    box-sizing: border-box;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: #463c50;
    text-align: center;
    font-family: ui-monospace, Menlo, monospace;
    outline: none;
    caret-color: #e09696;
  }
  .name-input::placeholder { color: rgba(120, 110, 130, 0.6); }

  /* ---------- account bar, login and scoreboard ---------- */
  .account-bar {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top));
    right: calc(8px + env(safe-area-inset-right));
    z-index: 20;
    display: none;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 70vw;
    font: 12px/1 ui-monospace, Menlo, monospace;
    color: #463c50;
  }
  .account-name:not(:empty) {
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(255, 246, 238, 0.85);
    border: 2px solid rgba(220, 195, 170, 0.9);
    font-weight: 600;
  }
  .account-status:not(:empty) { flex-basis: 100%; text-align: right; color: #b46464; }
  .account-link, .modal button {
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .account-link {
    padding: 6px 10px;
    border-radius: 999px;
    border: 2px solid rgba(220, 195, 170, 0.9);
    background: rgba(255, 246, 238, 0.6);
    color: #463c50;
  }
  .account-link:hover { background: rgba(255, 238, 170, 0.9); }

  .modal-back {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(40, 36, 60, 0.45);
    touch-action: auto;
  }
  .modal {
    box-sizing: border-box;
    width: min(420px, 100%);
    max-height: calc(100vh - 32px);
    overflow: auto;
    padding: 20px 22px 18px;
    border-radius: 18px;
    background: #fff6ee;
    border: 3px solid #dcc3aa;
    box-shadow: 0 8px 0 rgba(40, 36, 60, 0.18);
    color: #504658;
    font: 14px/1.4 ui-monospace, Menlo, monospace;
    text-align: center;
  }
  .modal-title { margin: 0 0 14px; font-size: 20px; color: #3c3246; }
  .modal-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .modal-tabs .tab {
    flex: 1;
    padding: 8px;
    border-radius: 10px;
    border: 2px solid #dcc3aa;
    background: transparent;
    color: #786e82;
  }
  .modal-tabs .tab.on { background: #f8c4ba; color: #3c3246; border-color: #e09696; }
  .auth-form { display: flex; flex-direction: column; gap: 8px; }
  .auth-form input {
    font: 16px ui-monospace, Menlo, monospace; /* 16px stops iOS zooming in */
    padding: 10px 12px;
    border-radius: 10px;
    border: 2px solid #dcc3aa;
    background: #fff;
    color: #3c3246;
    outline: none;
  }
  .auth-form input:focus { border-color: #ffd060; }
  .modal .primary {
    min-width: 140px;
    margin-top: 4px;
    padding: 10px;
    border-radius: 999px;
    border: 2px solid #c7912d;
    background: #ffd060;
    color: #3c3246;
    font-weight: 600;
  }
  .modal .primary:disabled { opacity: 0.6; }
  .modal .link { margin-top: 6px; border: none; background: none; color: #786e82; text-decoration: underline; }
  .auth-error { min-height: 1.2em; margin: 0; color: #b46464; font-size: 12px; }
  .auth-hint { margin: 10px 0 0; font-size: 11px; color: #786e82; }
  .board-body { margin-bottom: 12px; }
  table.board { width: 100%; border-collapse: collapse; font-size: 12px; }
  .board th { color: #786e82; font-weight: 400; padding: 4px; border-bottom: 2px solid #dcc3aa; }
  .board td { padding: 6px 4px; border-bottom: 1px solid #f0e2d4; }
  .board td:nth-child(2) { text-align: left; }
  .board tr.me td { background: #ffeeaa; font-weight: 600; }
  .board td.gold { color: #c7912d; font-weight: 600; }

  /* ---------- fps counter ---------- */
  .fps-meter {
    position: fixed;
    right: calc(8px + env(safe-area-inset-right));
    bottom: calc(6px + env(safe-area-inset-bottom));
    z-index: 25;
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(26, 31, 46, 0.55);
    color: #9fe0a8;
    font: 11px/1 ui-monospace, Menlo, monospace;
    pointer-events: none;
  }
  .fps-meter[data-level="ok"] { color: #ffd060; }
  .fps-meter[data-level="bad"] { color: #ff8c8c; }
  /* sit above the ACT button cluster in touch mode */
  body.touch-mode .fps-meter { bottom: calc(250px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<script type="module" src="./game.js"></script>
</body>
</html>
